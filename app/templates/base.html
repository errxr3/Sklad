<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15181d">
  <title>{% block title %}Склад зеркал{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
{% if employee %}
<div class="topbar">
  <a href="/" class="who">
    <b>{{ employee.name }}</b>
    <span class="site">{{ site.name }}</span>
  </a>
  <form method="post" action="/logout" style="margin:0">
    <button class="exit" type="submit">Выйти</button>
  </form>
</div>
{% endif %}

<div class="wrap">
  {% for message in messages %}
    <div class="msg {{ 'ok' if message.ok else 'err' }}">{{ message.text }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
